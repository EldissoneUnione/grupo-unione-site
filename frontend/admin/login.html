<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Área Administrativa | Grupo Unione</title>
    <link rel="icon" href="/public/Grupo-Unione_Logotipo.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div class="login-shell">
    <div class="login-card">
        <div class="login-logo-wrap">
            <img src="/assets/logo/Grupo-Unione_Logo.png" alt="Grupo Unione">
            <p class="login-brand">Área Administrativa</p>
        </div>

        <h1 class="login-title">Bem-vindo de volta</h1>
        <p class="login-subtitle">Introduza as suas credenciais para aceder ao painel</p>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user" style="color:var(--accent);margin-right:5px;"></i>
                    Utilizador
                </label>
                <input type="text" class="form-control" id="username" placeholder="admin" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock" style="color:var(--accent);margin-right:5px;"></i>
                    Palavra-passe
                </label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="login-remember">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Lembrar-me</label>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                <i class="fas fa-sign-in-alt"></i>
                Entrar no Painel
            </button>
        </form>

        <div id="loginError" class="alert alert-danger" style="display:none; margin-top:16px;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="loginErrorMsg">Utilizador ou palavra-passe inválidos.</span>
        </div>
    </div>
</div>

<script src="/admin/js/api.js"></script>
<script src="/admin/js/login.js"></script>

</body>
</html>
